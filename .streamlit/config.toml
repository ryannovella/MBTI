[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"
font = "Plus Jakarta Sans:https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&display=swap"
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true

[theme.light]
primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1E293B"

[theme.dark]
primaryColor = "#818CF8"
backgroundColor = "#090D16"
secondaryBackgroundColor = "#111827"
textColor = "#F1F5F9"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
